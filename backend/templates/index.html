<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retinal Fundus Image Quality Tool</title>

<style>

/* ================= ROOT COLORS ================= */

:root{
--primary:#2563eb;
--accent:#06b6d4;
--bg:#0f172a;
--card:#1e293b;
--soft:#334155;
--success:#22c55e;
--danger:#ef4444;
}

body{
margin:0;
font-family:Segoe UI, sans-serif;
background:linear-gradient(135deg,#0f172a,#1b2a40);
color:white;
}

/* ================= HEADER ================= */

.header-region{
padding:25px 30px;
}

/* rectangular title */

.title-box{
display:inline-block;
padding:12px 28px;
border-radius:40px;
background:linear-gradient(135deg,var(--primary),var(--accent));
box-shadow:0 0 25px rgba(6,182,212,.4);
font-size:18px;
font-weight:600;
letter-spacing:.3px;
}

/* ================= CONTAINER ================= */

.container{
max-width:1100px;
margin:auto;
padding:40px 20px 60px;
}

/* ================= GRID ================= */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:35px;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
}

/* ================= CARD ================= */

.card{
background:linear-gradient(145deg,#1e293b,#1a2435);
padding:35px;
border-radius:20px;
box-shadow:0 20px 45px rgba(0,0,0,.6);
}

/* ================= UPLOAD ================= */

.upload-title{
font-size:20px;
font-weight:600;
margin-bottom:20px;
}

.upload-box{
border:2px dashed #475569;
padding:30px 15px;
border-radius:14px;
text-align:center;
cursor:pointer;
transition:.3s ease;
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

.upload-box:hover{
border-color:var(--accent);
background:rgba(6,182,212,.08);
}

.upload-box input{
display:none;
}

.upload-icon{
font-size:26px;
opacity:.7;
}

.upload-text{
font-size:14px;
color:#cbd5e1;
}

.analyze-btn{
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,var(--primary),var(--accent));
color:white;
font-weight:600;
font-size:15px;
cursor:pointer;
transition:.3s ease;
}

.analyze-btn:hover{
transform:translateY(-3px);
box-shadow:0 15px 30px rgba(6,182,212,.5);
}

/* ================= FEATURE BUTTON ================= */

.feature-btn{
margin-top:10px;
display:inline-block;
padding:8px 14px;
border-radius:10px;
background:rgba(6,182,212,.15);
color:var(--accent);
text-decoration:none;
font-size:13px;
border:1px solid rgba(6,182,212,.4);
transition:.3s;
}

.feature-btn:hover{
background:var(--accent);
color:white;
}

/* ================= PREVIEW ================= */

.preview{
display:flex;
justify-content:center;
}

.preview img{
max-width:200px;
width:100%;
margin-top:20px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,.5);
}

/* ================= PIPELINE ================= */

.pipeline-title{
font-size:20px;
font-weight:600;
margin-bottom:20px;
}

.step{
padding:14px;
margin-bottom:12px;
border-radius:14px;
background:#334155;
transition:.3s ease;
}

.step.active{
background:linear-gradient(135deg,var(--primary),var(--accent));
}

.step:hover{
transform:translateX(5px);
}

/* ================= RESULT ================= */

.result{
margin-top:25px;
font-size:20px;
text-align:center;
font-weight:600;
}

.success-glow{color:var(--success);}
.danger-glow{color:var(--danger);}

.meter{
width:150px;
height:150px;
margin:25px auto;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:600;
background:#1e293b;
box-shadow:inset 0 0 25px rgba(0,0,0,.7);
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header-region">

<div class="title-box">
Retinal Fundus Image Quality Tool
</div>

</div>

<!-- ================= MAIN CONTAINER ================= -->

<div class="container">

<form method="POST" enctype="multipart/form-data">

<div class="grid">

<!-- LEFT CARD -->

<div class="card">

<div class="upload-title">
Upload Fundus Image
</div>

<label class="upload-box">

<div class="upload-icon">⬆</div>
<div class="upload-text">
Drag & Drop or Click to Upload
</div>

<input type="file" name="image" accept="image/*">

</label>

<button type="submit" class="analyze-btn">
Run Quality Analysis
</button>

<div class="preview">

{% if image_url %}
<img src="{{ image_url }}" alt="Uploaded retinal image">
{% endif %}

</div>

</div>

<!-- RIGHT CARD -->

<div class="card">

<div class="pipeline-title">
Processing Pipeline
</div>

<div class="step {% if result %}active{% endif %}">
Image Upload
</div>

<div class="step {% if result %}active{% endif %}">
Feature Extraction

{% if result %}
<br>

<a href="/features" class="feature-btn">
View Extracted Features →
</a>

{% endif %}

</div>

<div class="step {% if result %}active{% endif %}">
ML Classification
</div>

<div class="step {% if result %}active{% endif %}">
Final Decision
</div>

<div class="result 
{% if result and 'GOOD' in result %}success-glow
{% elif result %}danger-glow{% endif %}">

{{ result }}

</div>

{% if result %}

<div class="meter">
{{ confidence }}%
</div>

{% endif %}

</div>

</div>

</form>

</div>

</body>
</html>
